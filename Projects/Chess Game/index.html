<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="exit">
    </div>
    <div class="container">
        <h1>Chess Game</h1>
        <div class="game-info">
            <div class="current-player">Current Player: White</div>
            <div class="captured-pieces">
                <div class="white-captured"></div>
                <div class="black-captured"></div>
            </div>
        </div>
        <div class="chessboard"></div>
        <button class="reset-button">New Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
