<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayo's To-Do list Application (Home)</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
</head>
<body>
    <nav class="Home">
        <p class="menu">
            ...
        </p>
        <h1>
            Happy Monday
        </h1>
        <div class="profile">
            <a href="Profile.html" class="profile">
                <img src="Me.jpg" alt="">
            </a>
        </div>
    </nav>
    <main>
        <head>
            <p class="head">
                Its time for PRODUCTIVITY
            </p>
        </head>
        <div class="task_notify">
            <p class="task">
                You have 3 tasks today
            </p>
            <div class="close">
                <a href="">
                    <p class="close_button">
                        X
                    </p>
                </a>
            </div>
        </div>
        <div class="task_board">
            <div class="today">
                <h3>
                    Today's Tasks
                </h3>
                <small>
                    <a href="">
                        <p class="view_all">
                            See  All
                        </p>
                    </a>
                </small>
            </div>
            <div class="first">
                <div class="title">
                    <p class="topic">
                        Continue your online course
                    </p>         
                    <div class="edit">
                        <a href="">
                            <p class="edit_button">
                                ...
                            </p>
                        </a>
                    </div>          
                </div>
                <hr>
                <div class="status">
                    <p class="status_null">Not done</p>
                </div> 
            </div>
            <div class="second">
                <div class="title">
                    <p class="topic">
                        Wash your clothes
                    </p>
                    <div class="edit">
                        <a href="">
                            <p class="edit_button">
                                ...
                            </p>
                        </a>
                    </div>             
                </div>
                <hr>
                <div class="status">
                    <p class="status_full">Done</p>
                </div>       
            </div>
            <div class="Due">
                <h3>
                    Overdue Tasks <p class="overdue">!</p>
                </h3>
                <small>
                    <a href="">
                        <p class="view_all">
                            See  All
                        </p>
                    </a>
                </small>
            </div>
            <div class="first">
                <div class="title">
                    <p class="topic">
                        Read a book today
                    </p>         
                    <div class="edit">
                        <a href="">
                            <p class="edit_button">
                                ...
                            </p>
                        </a>
                    </div>          
                </div>
                <hr>
                <div class="status">
                    <p class="status_null_due">Not done</p>
                </div> 
            </div>
            <div class="second">
                <div class="title">
                    <p class="topic">
                        Go jogging
                    </p>
                    <div class="edit">
                        <a href="">
                            <p class="edit_button">
                                ...
                            </p>
                        </a>
                    </div>             
                </div>
                <hr>
                <div class="status">
                    <p class="status_null_due">Done</p>
                </div>       
            </div>
        </div>
    </main>
    <footer>
        <div class="home">
            <a href="Home.html">
                <p class="home_button">
                    Home
                </p>
            </a>
        </div>
        <div class="new_task">
            <a href="New_Task.html">
                <p class="new_button">
                    +
                </p>
            </a>
        </div>
        <div class="calender">
            <a href="Calender.html">
                <p class="date_button">
                    Calender
                </p>
            </a>
        </div>
    </footer>
</body>
</html>
