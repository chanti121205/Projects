<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayo's To-Do list Application (Calender)</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
</head>
<body>
    <nav class="calender">
        <a href="Home.html" class="back">
            <p ><b>X</b></p>
        </a>
        <h1 class="month">
            December
        </h1>
        <div class="profile">
            <a href="Profile.html" class="profile">
                <img src="Me.jpg" alt="">
            </a>
        </div>
    </nav>
    <main>
        <div class="current_month">
            <table>
                <tr >
                    <td>Su</td>
                    <td>Mo</td>
                    <td>Tu</td>
                    <td>We</td>
                    <td>Th</td>
                    <td>Fr</td>
                    <td>Sa</td>
                </tr>
                <tr>
                    <td></td>
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                    <td>4</td>
                    <td>5</td>
                    <td>6</td>
                </tr>
                <tr>
                    <td>7</td>
                    <td>8</td>
                    <td>9</td>
                    <td>10</td>
                    <td>11</td>
                    <td class="Birthday">12</td>
                    <td>13</td>
                </tr>
                <tr>
                    <td>14</td>
                    <td>15</td>
                    <td>16</td>
                    <td>17</td>
                    <td>18</td>
                    <td>19</td>
                    <td>20</td>
                </tr>
                <tr>
                    <td>21</td>
                    <td>22</td>
                    <td>23</td>
                    <td>24</td>
                    <td>25</td>
                    <td>26</td>
                    <td>27</td>
                </tr>
                <tr>
                    <td>28</td>
                    <td>29</td>
                    <td>30</td>
                    <td>31</td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </table>
        </div>
        <div class="task_notify">
            <p class="task">
                You have 3 tasks today
            </p>
            <div class="close">
                <p class="close_button">
                    X
                </p>
            </div>
        </div>
        <div class="task_board">
            <div class="today">
                <h3>
                    Today's Tasks
                </h3>
                <small>
                    <a href="">
                        <p class="view_all">
                            See  All
                        </p>
                    </a>
                </small>
            </div>
            <div class="first">
                <div class="title">
                    <p class="topic">
                        Continue your online course
                    </p>         
                    <div class="edit">
                        <a href="">
                            <p class="edit_button">
                                ...
                            </p>
                        </a>
                    </div>          
                </div>
                <hr>
                <div class="status">
                    <p class="status_null">Not done</p>
                </div> 
            </div>
            <div class="second">
                <div class="title">
                    <p class="topic">
                        Wash your clothes
                    </p>
                    <div class="edit">
                        <a href="">
                            <p class="edit_button">
                                ...
                            </p>
                        </a>
                    </div>             
                </div>
                <hr>
                <div class="status">
                    <p class="status_full">Done</p>
                </div>       
            </div>
        </div>
    </main>
    <footer>
        <div class="home">
            <a href="Home.html">
                <p class="home_button">
                    Home
                </p>
            </a>
        </div>
        <div class="new_task">
            <a href="New_Task.html">
                <p class="new_button">
                    +
                </p>
            </a>
        </div>
        <div class="calender">
            <a href="Calender.html">
                <p class="date_button">
                    Calender
                </p>
            </a>
        </div>
    </footer>
</body>
</html>
