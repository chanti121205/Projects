<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayo's To-Do list Application (New Task)</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
</head>
<body>
    <nav class="Task">
        <a href="Home.html" class="back">
            <p ><b>X</b></p>
        </a>
        <h1>
            Happy Monday
        </h1>
        <div class="profile">
            <a href="Profile.html" class="profile">
                <img src="Me.jpg" alt="">
            </a>
        </div>
    </nav>
    <h1 class="greeting">
        Good Day, Sayo
    </h1>
    <main class="new">
        <div class="new">
            <div class="schedule_day">
                <a href="" class="calender_sign">
                    <i class="uil uil-schedule"></i>
                </a>
                <p>
                    Tomorrow
                </p>
            </div>
            <input type="text" name="new_task" id="task" value="Input new task here">
            <label for="task">.</label>
            <div class="button">
                <button title="save" class="save">Save</button>
                <button title="discard" class="discard">Discard</button>
            </div>
    </main>
    <footer>
        <div class="home">
            <a href="Home.html">
                <p class="home_button">
                    Home
                </p>
            </a>
        </div>
        <div class="new_task">
            <a href="New_Task.html">
                <p class="new_button">
                    +
                </p>
            </a>
        </div>
        <div class="calender">
            <a href="Calender.html">
                <p class="date_button">
                    Calender
                </p>
            </a>
        </div>
    </footer>
</body>
</html>
