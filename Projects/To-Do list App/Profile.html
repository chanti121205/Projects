<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayo's To-Do list Application (Profile)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <body>
        <nav class="Profile">
            <a href="Home.html" class="back">
                <p ><b>X</b></p>
            </a>
            <h1>
                Happy Monday
            </h1>
            <div class="profile">
                <a href="Profile.html" class="profile">
                    <img src="Me.jpg" alt="">
                </a>
            </div>
        </nav>
        <main>
            <head>
                <p class="head">
                    Welcome to your profile page
                </p>
            </head>
            <div class="task_notify">
                <p class="task">
                    You have 3 tasks today
                </p>
                <div class="close">
                    <a href="">
                        <p class="close_button">
                            X
                        </p>
                    </a>
                </div>
            </div>
            <div class="task_overview">
                <p class="overview">
                    Tasks Overview
                </p>
                <div class="arc">
                    <div class="complete">
                        <p class="number">
                            2
                        </p>
                        <small class="if">
                            Completed Tasks
                        </small>
                    </div>
                    <div class="Pending">
                        <p class="number">
                            5
                        </p>
                        <small class="if">
                            Pending Tasks
                        </small>
                    </div>
                </div>
            </div>
            <div class="settings">
                <p>
                    Account Settings
                </p>
                <div class="pic">
                    <a href="" class="picedit">
                        Change profile picture
                    </a>
                </div>
                <div class="name">
                    <a href="" class="editname">
                        Edit your name
                    </a>
                </div>
                <div class="lang">
                    <a href="" class="editlang">
                        Language
                    </a>
                </div>
                <div class="acc">
                    <a href="" class="delete">
                        Delete account
                    </a>
                </div>
                <div class="log">
                    <a href="" class="logout">
                        Log out
                    </a>
                </div>
            </div>
        </main>
        <footer>
            <div class="home">
                <a href="Home.html">
                    <p class="home_button">
                        Home
                    </p>
                </a>
            </div>
            <div class="new_task">
                <a href="New_Task.html">
                    <p class="new_button">
                        +
                    </p>
                </a>
            </div>
            <div class="calender">
                <a href="Calender.html">
                    <p class="date_button">
                        Calender
                    </p>
                </a>
            </div>
        </footer>
    </body>
</body>
</html>
